services:
  converter:
    # nginx 1.31.3 on Alpine 3.24.1
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: convert-app
    restart: unless-stopped
    volumes:
      # Mount the directory (not the file) so git updates are served immediately.
      - ./site:/usr/share/nginx/html:ro
    networks:
      - production-network

networks:
  production-network:
    external: true
